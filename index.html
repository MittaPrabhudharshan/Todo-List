<style>
:root {
  --bg: #eef2ff;
  --surface: rgba(255, 255, 255, 0.96);
  --surface-strong: #ffffff;
  --text: #0f172a;
  --muted: #475569;
  --primary: #4f46e5;
  --primary-soft: rgba(99, 102, 241, 0.12);
  --border: rgba(148, 163, 184, 0.24);
  --shadow: 0 24px 72px rgba(15, 23, 42, 0.12);
}

html,
body {
  min-height: 100%;
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.18), transparent 24%), linear-gradient(180deg, #f8fbff 0%, #eef2ff 100%);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

body {
  overflow-x: hidden;
}

.navbar {
  background: rgba(255, 255, 255, 0.86) !important;
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.06);
}

.navbar-brand {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text);
}

.navbar-brand img {
  border-radius: 18px;
  background: #f8faff;
  padding: 10px;
  box-shadow: 0 18px 40px rgba(79, 70, 229, 0.12);
}

.container.p-5 {
  padding: 3rem 1.5rem 3.5rem !important;
}

.card {
  background: var(--surface);
  border: none;
  border-radius: 24px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.btn-outline-primary {
  border-radius: 999px;
  padding: 0.95rem 1.5rem;
  font-weight: 700;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
}

.btn-outline-primary:hover {
  background: var(--primary-soft);
  border-color: transparent;
  transform: translateY(-1px);
  box-shadow: 0 16px 32px rgba(79, 70, 229, 0.16);
}

.table {
  border: none;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
}

.table thead {
  background: rgba(79, 70, 229, 0.06);
}

.table th,
.table td {
  border: none;
  padding: 1.3rem 1rem;
  vertical-align: middle;
}

.table tbody tr {
  transition: background-color 0.2s ease;
}

.table tbody tr:hover {
  background: rgba(79, 70, 229, 0.08);
}

.table tbody td:first-child {
  font-weight: 700;
}

.action-icon {
  cursor: pointer;
  font-size: 1.3rem;
  transition: transform 0.2s ease, color 0.2s ease;
}

.action-icon:hover {
  transform: translateY(-1px);
}

.action-icon.text-success:hover {
  color: #16a34a;
}

.action-icon.text-primary:hover {
  color: #4338ca;
}

.modal-content {
  border-radius: 24px;
  border: none;
  box-shadow: 0 28px 90px rgba(15, 23, 42, 0.14);
}

.modal-header,
.modal-footer {
  border: none;
  padding: 1.25rem 1.5rem;
}

.modal-header {
  background: rgba(248, 250, 255, 0.9);
}

.modal-title {
  font-weight: 700;
}

.modal-body label {
  color: var(--muted);
  font-size: 0.95rem;
}

.form-control {
  border-radius: 16px;
  border: 1px solid rgba(148, 163, 184, 0.2);
  box-shadow: none;
}

.form-control:focus {
  box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
  border-color: rgba(79, 70, 229, 0.32);
}

.btn-secondary,
.btn-primary {
  border-radius: 999px;
}

@media (max-width: 768px) {
  .container.p-5 {
    padding: 2rem 1rem 2.5rem !important;
  }

  .table th,
  .table td {
    padding: 1rem 0.85rem;
  }
}
</style>

<script> 
createHTMLfromStorage(); 
function showAddTaskModal() { 
$("#addTaskModal").modal('show'); 
} 
function addTask() { 
console.log('Add Task clicked') 
$("#addTaskModal").modal('hide') 
var dataArr = $("#taskInputForm").serializeArray(); 
var taskObject = {}; 
var storageObjectArr = []; 
var storageObject = localStorage.getItem('taskStorage'); 
//  document.write(JSON.stringify(storageObject)) 
for (var i in dataArr) { 
var name = dataArr[i]['name'] 
var value = dataArr[i]['value'] 
taskObject[name] = value 
} 
if (storageObject != null && storageObject != undefined && storageObject != '') { 
storageObjectArr = JSON.parse(storageObject) 
storageObjectArr.push(taskObject) 
} else { 
storageObjectArr.push(taskObject) 
} 
localStorage.setItem('taskStorage', JSON.stringify(storageObjectArr)) 
createHTMLfromStorage() 
$("#taskInputForm").trigger('reset') 
} 
function createHTMLfromStorage() { 
var storageObjectArr = []; 
var storageObject = localStorage.getItem('taskStorage'); 
var storageObjectArr = JSON.parse(storageObject) 
var html = ''; 
console.log(storageObject) 
if (storageObject != null && storageObject != undefined && storageObject != '') { 
if (storageObjectArr && storageObjectArr.length > 0) { 
for (let i in storageObjectArr) { 
var date = new Date(storageObjectArr[i]['taskETA']) 
html = html + '<tr>' 
+ '<td>' + (parseInt(i) + 1) + '</td>' 
+ '<td>' + storageObjectArr[i]['taskDescription'] + '</td>' 
+ '<td>' + storageObjectArr[i]['taskResponsiblePerson'] + '</td>' 
+ '<td>' + date.toUTCString() + '</td>' 
// + '<td><i class="bi bi-check-circle-fill" onclick= "markAsDone(' + i + 
// ')"></i><i class="bi bi-pencil-square" onclick="editTask(' + i + ')"></i></td>
+ '<td>' +
'<i class="bi bi-check-circle-fill text-success action-icon" onclick="markAsDone(' + i + ')"></i>' +
'<i class="bi bi-pencil-square text-primary action-icon ms-3" onclick="editTask(' + i + ')"></i>' +
'</td>'
'</tr>'
} 
} else { 
html = '<tr><td colspan="5">No Tasks Added yet</td></tr>' 
} 
} 
$("#taskTableBody").html(html) 
}

function markAsDone(index) {
    let storage = localStorage.getItem('taskStorage');
    let tasks = storage ? JSON.parse(storage) : [];

    tasks.splice(index, 1); 
    localStorage.setItem('taskStorage', JSON.stringify(tasks));
    createHTMLfromStorage();
}

// $("#updateTaskModal").modal('show')

function editTask(index) {
    let storage = localStorage.getItem('taskStorage');
    let tasks = storage ? JSON.parse(storage) : [];

    $("#editTaskTextArea").val(tasks[index].taskDescription);
    $("#editResponsiblePerson").val(tasks[index].taskResponsiblePerson);
    $("#editETA").val(tasks[index].taskETA);
    $("#editIndex").val(index);

    $("#updateTaskModal").modal('show');
}

function updateTask() {
    $("#updateTaskModal").modal('hide');

    let dataArr = $("#taskUpdateForm").serializeArray();
    let updatedTask = {};
    let tasks = JSON.parse(localStorage.getItem('taskStorage'));

    dataArr.forEach(item => {
        updatedTask[item.name] = item.value;
    });

    tasks[updatedTask.taskIndex] = updatedTask;

    localStorage.setItem('taskStorage', JSON.stringify(tasks));
    createHTMLfromStorage();
}
